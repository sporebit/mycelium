<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mycelium desktop — Burrow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#12140f}
a{color:#ebe7d8}a:hover{color:#fff}
button{font:inherit}
.press{transition:transform 140ms ease-out}
.press:active{transform:scale(0.97)}
.press:focus-visible,a:focus-visible{outline:2px solid #ebe7d8;outline-offset:3px}
.fly{transition:transform 850ms cubic-bezier(0.2,0,0,1), opacity 500ms ease-out}
@media (prefers-reduced-motion: reduce){.press,.fly{transition:none}}
</style>
</helmet>
<div onMouseMove="{{onMove}}" onMouseLeave="{{onLeave}}" style="position: relative; min-height: 960px; height: 100vh; overflow: hidden; background: #12140f; color: #ebe7d8; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 15px; line-height: 1.4">
<canvas ref="{{setCanvas}}" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"></canvas>

<svg aria-hidden="true" viewBox="0 0 100 120" width="210" height="250" style="position: absolute; left: -46px; top: 36%; transform: rotate(74deg)">
<path d="M42 118 C45 96 43 76 45 56 L55 56 C57 76 55 96 58 118 Z" fill="#d6ccb0"></path><path d="M6 58 C8 24 34 6 50 6 C66 6 92 24 94 58 C72 66 28 66 6 58 Z" fill="#c9744a"></path><path d="M6 58 C28 66 72 66 94 58 C74 72 26 72 6 58 Z" fill="#12140f" fill-opacity="0.35"></path><circle cx="30" cy="32" r="6" fill="#fff" fill-opacity="0.22"></circle><circle cx="60" cy="20" r="5" fill="#fff" fill-opacity="0.22"></circle><circle cx="74" cy="42" r="6" fill="#fff" fill-opacity="0.16"></circle>
</svg>
<svg aria-hidden="true" viewBox="0 0 100 120" width="120" height="150" style="position: absolute; left: -22px; top: 58%; transform: rotate(62deg)">
<path d="M42 118 C45 96 43 76 45 56 L55 56 C57 76 55 96 58 118 Z" fill="#d6ccb0"></path><path d="M6 58 C8 24 34 6 50 6 C66 6 92 24 94 58 C72 66 28 66 6 58 Z" fill="#d9a441"></path><path d="M6 58 C28 66 72 66 94 58 C74 72 26 72 6 58 Z" fill="#12140f" fill-opacity="0.35"></path>
</svg>
<svg aria-hidden="true" viewBox="0 0 100 120" width="190" height="230" style="position: absolute; right: -44px; top: 22%; transform: rotate(-70deg)">
<path d="M42 118 C45 96 43 76 45 56 L55 56 C57 76 55 96 58 118 Z" fill="#d6ccb0"></path><path d="M6 58 C8 24 34 6 50 6 C66 6 92 24 94 58 C72 66 28 66 6 58 Z" fill="#b08fb8"></path><path d="M6 58 C28 66 72 66 94 58 C74 72 26 72 6 58 Z" fill="#12140f" fill-opacity="0.35"></path><circle cx="34" cy="28" r="6" fill="#fff" fill-opacity="0.2"></circle><circle cx="66" cy="34" r="5" fill="#fff" fill-opacity="0.18"></circle>

<svg aria-hidden="true" viewBox="0 0 100 120" width="110" height="136" style="position: absolute; right: -18px; top: 46%; transform: rotate(-58deg)">

</svg>

<sc-for list="{{signs}}" as="s" hint-placeholder-count="16">
<a href="#burrow" style="position: absolute; left: {{s.left}}; top: {{s.top}}; transform: {{s.shift}}; padding: 8px 8px; text-decoration: none; white-space: nowrap; color: {{s.fg}}; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: {{s.size}}; text-shadow: 0 1px 8px #12140f, 0 0 2px #12140f">{{s.label}}<span style="font-family: 'Atkinson Hyperlegible', sans-serif; font-weight: 400; font-size: 12px; color: #c5c1ae">{{s.quiet}}</span></a>
</sc-for>

<div style="position: absolute; inset: 0; perspective: 1000px; perspective-origin: 50% 46%; pointer-events: none">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
<article class="fly" style="position: absolute; left: 50%; top: 50%; width: 440px; margin-left: -220px; box-sizing: border-box; padding: 22px 24px; border-radius: 22px; background: #23281f; box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset, 0 0 0 1px rgba(232,220,192,0.10), 0 30px 60px rgba(0,0,0,0.55); transform: translate3d({{c.tx}}, {{c.ty}}, {{c.tz}}); opacity: {{c.op}}; pointer-events: {{c.pe}}; z-index: {{c.zi}}; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: #c5c1ae"><span>{{c.kind}}</span><span style="font-family: 'JetBrains Mono', monospace">{{c.when}} · {{c.est}}</span></div>
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.1; text-wrap: balance">{{c.title}}</h2>
<sc-if value="{{c.front}}" hint-placeholder-val="{{true}}">
<p style="margin: 0; font-size: 16px; color: #d7d2bd; text-wrap: pretty">{{c.step}}</p>
<div style="display: flex; gap: 8px; margin-top: 4px">
<button class="press" type="button" onClick="{{c.done}}" style="flex: 1; border: 0; border-radius: 12px; min-height: 50px; cursor: pointer; background: {{c.cap}}; color: #1b1f17; font-weight: 700; font-size: 16px">Done — keep going</button>
<button class="press" type="button" onClick="{{c.later}}" style="border: 0; border-radius: 12px; min-height: 50px; padding: 0 18px; cursor: pointer; background: #333a2c; color: #ebe7d8">Not now</button>
</div>
</sc-if>
</article>
</sc-for>
</div>

<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 50%; top: 46%; width: 420px; margin-left: -210px; text-align: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px; text-shadow: 0 2px 12px #12140f">Nothing ahead. The tunnel is clear for today.</div>
</sc-if>

<header style="position: absolute; left: 0; right: 0; top: 0; height: 60px; z-index: 50; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 20px; background: rgba(21,23,19,0.94); box-shadow: 0 1px 0 rgba(236,230,210,0.14); color: #e6e1cf">
<div style="font-family: {{brandFont}}; font-weight: 700; font-size: 22px; margin-right: 12px">Mycelium</div>
<nav aria-label="Main menu" style="display: flex; align-items: center; gap: 2px">
<sc-for list="{{menu}}" as="g" hint-placeholder-count="9">
<div style="position: relative">
<button class="press" type="button" aria-expanded="{{g.open}}" onClick="{{g.toggle}}" style="display: flex; align-items: center; gap: 6px; border: 0; border-radius: 8px; padding: 0 12px; min-height: 44px; cursor: pointer; background: {{g.bg}}; color: #e6e1cf; font-weight: 700; font-size: 15px">
<span>{{g.label}}</span>
<sc-if value="{{g.multi}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></sc-if>
</button>
<sc-if value="{{g.open}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; top: 52px; min-width: 232px; padding: 6px; border-radius: 12px; background: #24271f; box-shadow: 0 0 0 1px rgba(236,230,210,0.14), 0 18px 40px rgba(0,0,0,0.55); display: flex; flex-direction: column">
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
<a href="#menu" style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 11px 12px; border-radius: 8px; text-decoration: none; color: #e6e1cf; font-size: 15px"><span>{{it.label}}</span><span style="font-size: 12.5px; color: #c2bda8">{{it.quiet}}</span></a>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
</nav>
<div style="flex: 1"></div>
<div role="group" aria-label="Home view" style="display: flex; gap: 2px; padding: 3px; border-radius: 11px; box-shadow: 0 0 0 1px rgba(236,230,210,0.2)">
<sc-for list="{{views}}" as="v" hint-placeholder-count="4">
<a href="{{v.href}}" style="display: flex; align-items: center; padding: 0 12px; min-height: 38px; border-radius: 8px; text-decoration: none; white-space: nowrap; background: {{v.bg}}; color: {{v.fg}}; font-weight: 700; font-size: 14px">{{v.label}}</a>
</sc-for>
</div>
<div role="group" aria-label="Whose day" style="display: flex; gap: 2px; margin-left: 8px">
<sc-for list="{{people}}" as="p" hint-placeholder-count="3">
<button class="press" type="button" aria-pressed="{{p.on}}" onClick="{{p.pick}}" style="border: 0; border-radius: 8px; padding: 0 12px; min-height: 44px; cursor: pointer; background: {{p.bg}}; color: {{p.fg}}; font-weight: 700; font-size: 14px">{{p.label}}</button>
</sc-for>
</div>
<button class="press" type="button" style="margin-left: 8px; border: 0; border-radius: 10px; padding: 0 20px; min-height: 44px; cursor: pointer; background: #ece6d2; color: #1c1e18; font-weight: 700; font-size: 15px">Capture</button>
</header>

<div style="position: absolute; right: 28px; top: 76px; display: flex; align-items: center; gap: 14px">
<div style="color: #d7d2bd">Wed 18 Nov · 14:10 · 7 spores to sort tonight</div>
</div>

<div style="position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; align-items: baseline; gap: 22px; padding: 10px 18px; border-radius: 14px; background: rgba(27,31,23,0.9); white-space: nowrap">
<span><span style="font-family: 'JetBrains Mono', monospace; color: #ebe7d8">{{behind}}</span> <span style="color: #c5c1ae">behind you today</span></span>
<span><span style="font-family: 'JetBrains Mono', monospace; font-size: 20px">2:40</span> <span style="color: #c5c1ae">hours left this week</span></span>
<span><span style="font-family: 'JetBrains Mono', monospace; color: #ebe7d8">{{lifetime}}</span> <span style="color: #c5c1ae">since May</span></span>
</div>
</div>
</x-dc>

renderVals() {
